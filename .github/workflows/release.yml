name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Publish single file
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/QuickBooks.Mcp.Server -c Release -r ${{ matrix.rid }} -p:Version="$version" -o out
          cp out/quickbooks-mcp.exe "quickbooks-mcp-${{ matrix.rid }}.exe"
          sha256sum "quickbooks-mcp-${{ matrix.rid }}.exe" > "quickbooks-mcp-${{ matrix.rid }}.exe.sha256"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: quickbooks-mcp-${{ matrix.rid }}.exe
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: quickbooks-mcp-${{ matrix.rid }}.exe*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release notes from Conventional Commits
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file ../RELEASE_NOTES.md quickbooks-mcp-*.exe SHA256SUMS.txt

  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish the launcher with the release checksums
        working-directory: packaging/npm
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt
          node scripts/write-checksums.js SHA256SUMS.txt checksums.json
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm test
          npm publish --provenance --access public

  nuget:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack and push
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet pack src/QuickBooks.Mcp.Server -c Release -p:Version="${GITHUB_REF_NAME#v}" -o nupkg
          dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  mcpb:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.rid }}
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Pack the bundle and add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p stage/server
          sed "s/__VERSION__/$version/" packaging/mcpb/manifest.json > stage/manifest.json
          cp "dist/quickbooks-mcp-${{ matrix.rid }}.exe" stage/server/quickbooks-mcp.exe
          cp README.md LICENSE stage/
          npx -y @anthropic-ai/mcpb validate stage/manifest.json
          npx -y @anthropic-ai/mcpb pack stage "quickbooks-mcp-${{ matrix.rid }}.mcpb"
          gh release upload "$GITHUB_REF_NAME" "quickbooks-mcp-${{ matrix.rid }}.mcpb" --repo "$GITHUB_REPOSITORY"

  registry:
    needs: [npm, nuget, mcpb]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build server.json for this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.mcpb'
          jq --arg v "$version" '.version = $v | .packages |= map(.version = $v)' server.json > server.tmp
          for rid in win-x64 win-x86; do
            file="quickbooks-mcp-$rid.mcpb"
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            jq --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$file" --arg sha "$sha" \
              '.packages += [{registryType: "mcpb", identifier: $url, fileSha256: $sha, transport: {type: "stdio"}}]' server.tmp > server.next
            mv server.next server.tmp
          done
          mv server.tmp server.json
          cat server.json
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  sbom:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate and attach the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX src/QuickBooks.Mcp.Server/QuickBooks.Mcp.Server.csproj -o sbom -F Json
          mv sbom/bom.json quickbooks-mcp.cdx.json
          gh release upload "$GITHUB_REF_NAME" quickbooks-mcp.cdx.json --repo "$GITHUB_REPOSITORY"
